[project]
name = "enterprise-healing-agent"
version = "0.1.0"
description = "Enterprise Data Pipeline Orchestration Agent"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi==0.115.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "requests==2.32.3",
    "structlog==24.4.0",
    "google-genai>=0.1.0",
    "langgraph>=0.2.32",
    "langchain-core>=0.3.10",
    "langchain-google-genai>=2.0.0",
    "python-dotenv==1.0.1",
    "aiofiles>=23.0.0",
    "python-multipart>=0.0.9",
    "pg8000>=1.30.1",
    "sqlglot>=25.0.0",
    "fpdf2>=2.7.0",
    "uharfbuzz>=0.39.0",
    "pyyaml>=6.0"
]
[project.optional-dependencies]
local = [
    "uvicorn[standard]==0.30.1",
    "pytest==7.4.2",
    "pypdf>=4.0.0"
]

[tool.vercel]
entrypoint = "src.api.main:app"

# The React build (frontend/dist) is mounted with StaticFiles in src/api/main.py. Vercel moves
# those files to its CDN; cdn = true keeps that on even though main.py has a middleware
# (the middleware only creates the database tables, the static files need no login).
[tool.vercel.fastapi.static]
cdn = true
